; PgBouncer của compose, mô phỏng Pooler pg-main-pooler-rw (gitops/infra/pg-main/pooler.yaml). Trên lab operator CNPG
; sinh file này. Giống hệt services/hello/src/test/resources/testcontainers/pgbouncer.ini, trừ [databases].
; Đổi pooler.yaml thì đổi file này cùng lúc. Sửa xong: docker compose restart pgbouncer.

[databases]
; Lab: operator sinh "* = host=pg-main-rw" cho mọi database. Ở đây liệt kê từng database của service (G1 thêm một dòng
; mỗi service) để nối nhầm tên database thì lỗi ngay ở PgBouncer.
hello = host=postgres port=5432 dbname=hello

[pgbouncer]
listen_addr = 0.0.0.0
; Lab nghe 5432 (operator ép). Compose dùng 6432, cổng mặc định của PgBouncer (host: 16432, xem compose.yaml).
listen_port = 6432
pool_mode = transaction

; LỆCH LAB: lab dùng auth_query qua role cnpg_pooler_pgbouncer với client cert. Compose dùng file mật khẩu plaintext:
; PgBouncer dùng chính mật khẩu đó để đăng nhập PostgreSQL bằng SCRAM.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Hai tham số giống parameters của pooler.yaml (lý do ghi ở file đó).
default_pool_size = 8
server_login_retry = 2
; Không có trong pooler.yaml: operator đặt mặc định này (cần để libpq kết nối được, lib/pq#475).
ignore_startup_parameters = extra_float_digits,options

; LỆCH LAB: không TLS (lab: client_tls_sslmode require, server_tls_sslmode verify-ca).
