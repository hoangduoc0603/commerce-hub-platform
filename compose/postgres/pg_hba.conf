# pg_hba của compose, theo spec.postgresql.pg_hba của pg-main (gitops/infra/pg-main/cluster.yaml): mỗi role LOGIN chỉ vào
# database của nó, dòng cuối reject. Thiếu reject thì role nào có mật khẩu cũng vào được database nào, và lỗi nối nhầm
# database chỉ lộ ra khi lên lab. Dòng khớp đầu tiên thắng.
#
# LỆCH LAB: `host` thay cho `hostssl` (compose không có TLS). Lab còn có luật cert cho streaming_replica và
# cnpg_pooler_pgbouncer do operator thêm; compose không có hai role đó (PgBouncer dùng auth_file, xem pgbouncer.ini).
#
# Sửa file này chỉ cần: docker compose exec postgres psql -U postgres -c 'SELECT pg_reload_conf()'

# Socket trong container: entrypoint (initdb, script trong initdb/) và pg_isready. Chỉ ai đã vào được container mới dùng được.
local   all       all                              trust

# Superuser để xem DB từ host (psql -h localhost -p 15432 -U postgres). Lab không cho postgres vào qua mạng.
host    all       postgres                all      scram-sha-256

host    keycloak  keycloak                all      scram-sha-256
host    hello     hello_migrator,hello_app all     scram-sha-256

host    all       all                     all      reject
