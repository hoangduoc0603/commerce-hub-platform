{{- /*
Deployment của workload. Biến môi trường từ Secret qua secretEnv (ticket 27).
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- /* Rollout theo zero-downtime.md: thêm pod mới trước, chỉ tắt pod cũ khi pod mới đã available. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      {{- /* Annotation đổi thì pod template đổi, Deployment rollout. Cùng input thì cùng giá trị (Argo CD không OutOfSync). */}}
      annotations:
        {{- if .Values.env }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        commerce-hub/secret-revision: {{ .Values.secretRevision | quote }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      {{- /* Đặt cả ở pod: khi serviceAccount.create=false pod dùng SA "default", vốn mặc định mount token. */}}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- /* Không bơm biến <SERVICE>_PORT, <SERVICE>_SERVICE_HOST của mọi Service trong namespace vào pod. */}}
      enableServiceLinks: false
      {{- /* preStop 10 + shutdown web 20 + Kafka listener 20 + dự phòng. Hết hạn thì SIGKILL. */}}
      terminationGracePeriodSeconds: 60
      {{- /* Pod Security Standards "restricted" (helm-chart.md "Bảo mật pod"). Không mở qua values. */}}
      securityContext:
        {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: app
          image: {{ include "app.image" . | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "app.containerSecurityContext" . | nindent 12 }}
          {{- $runtimeEnv := include "app.runtimeEnv" . | trim }}
          {{- /* Đổi nội dung Secret không làm pod rollout: tăng secretRevision trong cùng commit. */}}
          {{- $secretEnv := include "app.secretEnv" (dict "map" .Values.secretEnv "path" "secretEnv") | trim }}
          {{- if or $runtimeEnv $secretEnv }}
          env:
            {{- with $runtimeEnv }}{{ . | nindent 12 }}{{ end }}
            {{- with $secretEnv }}{{ . | nindent 12 }}{{ end }}
          {{- end }}
          {{- /* Trùng tên thì env thắng envFrom: ConfigMap không ghi đè được JAVA_TOOL_OPTIONS của chart. */}}
          {{- if .Values.env }}
          envFrom:
            - configMapRef:
                name: {{ include "app.fullname" . }}
          {{- end }}
          ports:
            {{- range $name, $port := .Values.ports }}
            - name: {{ $name }}
              containerPort: {{ $port }}
              protocol: TCP
            {{- end }}
          {{- /* API server và kubeconform không kiểm port tên "http" có tồn tại không, nên chart tự chặn. */}}
          {{- $_ := required "ports.http là bắt buộc: probe trỏ vào cổng tên http" .Values.ports.http }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            {{- /* Chờ EndpointSlice, kube-proxy, Envoy gỡ pod khỏi danh sách trước khi app nhận SIGTERM. */}}
            preStop:
              sleep:
                seconds: 10
          resources:
            {{- include "app.resources" (dict "resources" .Values.resources "path" "resources") | nindent 12 }}
          volumeMounts:
            {{- include "app.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "app.volumes" . | nindent 8 }}
