{{- /*
ServiceAccount riêng cho mỗi release (helm-chart.md "ServiceAccount").
Comment template (dấu ngoặc nhọn kèm sao) không xuất hiện trong manifest; comment # thì có.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* Kubernetes mặc định true: pod nào dùng SA này cũng có token gọi API. Tắt thì lộ pod không lộ quyền. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
