{{- /*
SealedSecret từ values.sealedSecrets (ticket 27 Q1). Khóa của map là tên Secret, giữ nguyên chữ, không ghép
fullname: scope strict của kubeseal gắn tên và namespace vào bản mã, đổi tên là controller không giải mã được.
Không đặt metadata.namespace: Argo CD áp vào namespace đích của app, cũng là namespace lúc seal.
*/ -}}
{{- range $name, $s := .Values.sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    {{- /*
    preSync: Secret phải có TRƯỚC Job PreSync. Argo CD xếp theo phase rồi mới tới wave, nên SealedSecret thường
    ở wave -1 vẫn áp sau Job. Hook wave -1 thì Argo CD chờ nó Healthy (health Lua có sẵn: đã giải mã) rồi mới
    chạy Job ở wave 0. HookSucceeded: sync xong thì xóa, Secret con bị GC theo, credential chỉ sống trong lúc
    sync; sync lỗi thì giữ lại, lần sau apply đè lên.
    */}}
    {{- if $s.preSync }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    {{- end }}
    {{- /* Secret thường: trước Deployment (wave 0) trong phase Sync (gitops-argocd.md "Sync waves"). */}}
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    {{- required (printf "sealedSecrets.%s.encryptedData là bắt buộc (dán từ output của kubeseal)" $name) $s.encryptedData | toYaml | nindent 4 }}
  {{- /* template mô tả Secret mà controller sinh ra. */}}
  template:
    metadata:
      {{- /* Chỉ nhãn ổn định: app.labels có version (git SHA), đổi mỗi lần deploy sẽ làm SealedSecret đổi theo. */}}
      labels:
        {{- include "app.selectorLabels" $ | nindent 8 }}
    {{- /* Phải trùng type lúc seal. basic-auth cho mật khẩu DB (giống bản ở namespace postgres). */}}
    type: {{ $s.type | default "Opaque" }}
{{- end }}
