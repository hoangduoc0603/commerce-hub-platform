# Thử container-image.yml ngay trong platform: PR thì chỉ build, push vào main thì push image thử lên GHCR.
# Image thử: ghcr.io/<owner>/commerce-hub-platform-smoke (ticket G0-17, repo docs).
name: ghcr-smoke

on:
  push:
    branches: [main]
    # Chỉ chạy khi đổi chính workflow hoặc image thử, để không push image mỗi lần sửa README.
    paths:
      - .github/workflows/container-image.yml
      - .github/workflows/ghcr-smoke.yml
      - .github/ghcr-smoke/**
  pull_request:
    paths:
      - .github/workflows/container-image.yml
      - .github/workflows/ghcr-smoke.yml
      - .github/ghcr-smoke/**
  # Chạy tay để thử lại; trên main nó cũng chỉ build, vì event_name không phải push.
  workflow_dispatch:

permissions:
  contents: read

# PR: hủy lần chạy cũ khi có commit mới. Push vào main: không hủy, để một lần push đang dở không bị cắt ngang.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    # Cùng repo nên gọi bằng đường dẫn ./: workflow được gọi lấy từ cùng commit với file này, không cần ghim SHA.
    # Repo khác (ví dụ hello ở ticket G0-23) phải gọi
    # <owner>/commerce-hub-platform/.github/workflows/container-image.yml@<SHA 40 ký tự> # vX.Y.Z
    uses: ./.github/workflows/container-image.yml
    # Mức trần cho mọi job bên trong. Job build không có packages: write.
    permissions:
      contents: read
      packages: write
      # Báo cáo Trivy (SARIF) lên Code scanning, từ v0.2.0.
      security-events: write
    with:
      image: commerce-hub-platform-smoke
      context: .github/ghcr-smoke
